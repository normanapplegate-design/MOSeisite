<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Finder &middot; MOSei</title>
<meta name="description" content="Search the tagged Tempered Signal archive. Describe your situation in your own words and get the exact framework concept and action for it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1a2744; --navy-deep: #111c33; --gold: #C9A84C; --gold-light: #e8c97a;
  --ink: #1d2230; --text: #2d3142; --text-muted: #5a6072; --hint: #8b91a0;
  --border: #e3e6ec; --cream: #f8f5ef; --cream-dark: #eeebe3;
  --surface: #ffffff; --radius: 10px; --radius-lg: 14px;
  --serif: 'EB Garamond', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.site-nav { background: var(--navy); padding: 14px 2rem; display: flex; align-items: center; justify-content: space-between; }
.nav-logo { font-family: var(--serif); font-size: 1.2rem; color: #fff; text-decoration: none; }
.nav-logo span { color: var(--gold); }
.nav-back { font-size: 0.78rem; color: rgba(255,255,255,0.55); text-decoration: none; border: 0.5px solid rgba(255,255,255,0.2); padding: 5px 14px; border-radius: 20px; transition: color 0.2s; }
.nav-back:hover { color: #fff; }
.page-hero { background: var(--navy); padding: 3.5rem 2rem 2.5rem; text-align: center; border-bottom: 3px solid var(--gold); }
.hero-eyebrow { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; }
.hero-title { font-family: var(--serif); font-size: 2.3rem; color: #fff; margin-bottom: 0.75rem; line-height: 1.2; }
.hero-sub { font-size: 0.95rem; color: rgba(255,255,255,0.55); max-width: 560px; margin: 0 auto; line-height: 1.7; }
.wrap { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
.search-box { position: relative; margin-bottom: 1.25rem; }
.search-input { width: 100%; font-family: var(--sans); font-size: 1rem; padding: 14px 18px; border-radius: var(--radius-lg); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); outline: none; transition: border-color 0.15s; }
.search-input:focus { border-color: var(--navy); }
.search-input::placeholder { color: var(--hint); }
.result-count { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 1rem; }
.chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 1.75rem; }
.chip { font-size: 0.72rem; font-weight: 500; padding: 6px 13px; border-radius: 20px; border: 1px solid rgba(26,39,68,0.18); color: var(--navy); background: var(--surface); cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap; }
.chip:hover { background: var(--cream-dark); border-color: var(--navy); }
.chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.chip-clear { font-size: 0.72rem; font-weight: 500; color: var(--text-muted); cursor: pointer; text-decoration: underline; padding: 6px 4px; }
.scenario-list { display: flex; flex-direction: column; gap: 0.65rem; }
.scenario-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: border-color 0.15s; }
.scenario-card.open { border-color: var(--gold); }
.scenario-head { padding: 1.1rem 1.35rem; cursor: pointer; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
.scenario-situation { font-size: 0.92rem; color: var(--ink); font-style: italic; line-height: 1.55; }
.scenario-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.4rem; }
.scenario-caret { flex-shrink: 0; font-size: 0.8rem; color: var(--gold); margin-top: 2px; transition: transform 0.15s; }
.scenario-card.open .scenario-caret { transform: rotate(90deg); }
.scenario-body { max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }
.scenario-card.open .scenario-body { max-height: 500px; }
.scenario-body-inner { padding: 0 1.35rem 1.35rem; border-top: 1px solid var(--border); margin-top: 0; }
.scenario-block { margin-top: 1rem; }
.scenario-label { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem; }
.scenario-value { font-size: 0.85rem; color: var(--text); line-height: 1.65; }
.scenario-value.framework { color: var(--navy); font-weight: 500; }
.scenario-cite { font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem; padding-top: 0.85rem; border-top: 1px dashed var(--border); }
.scenario-cite b { color: var(--ink); font-weight: 500; }
.empty-state { text-align: center; padding: 3rem 1.5rem; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-lg); }
.empty-state p { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.6; }
.empty-state a { display: inline-block; font-size: 0.82rem; font-weight: 500; color: #fff; background: var(--navy); padding: 9px 20px; border-radius: var(--radius); text-decoration: none; }
.loading-state { text-align: center; padding: 3rem; font-size: 0.85rem; color: var(--text-muted); }
.page-footer { background: var(--navy); padding: 1.5rem 2rem; text-align: center; }
.footer-text { font-size: 0.75rem; color: rgba(255,255,255,0.35); }
.footer-text a { color: var(--gold); text-decoration: none; }
@media (max-width: 640px) {
  .hero-title { font-size: 1.75rem; }
  .scenario-head { padding: 1rem; }
}
</style>
<script defer data-domain="mosei.org" src="https://plausible.io/js/script.js"></script>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-logo">MOS<span>ei</span></a>
  <a href="tools.html" class="nav-back">&larr; Back to Tools</a>
</nav>

<div class="page-hero">
  <p class="hero-eyebrow">The Tempered Signal Archive</p>
  <h1 class="hero-title">Find your situation</h1>
  <p class="hero-sub" id="hero-sub">Search in your own words. Every tagged issue of The Tempered Signal, matched to the exact action and the framework concept behind it.</p>
</div>

<div class="wrap">
  <div class="search-box">
    <input type="text" class="search-input" id="search-input" placeholder="Describe what's going on -- e.g. 'a leader won't let go of the role'">
  </div>
  <p class="result-count" id="result-count"></p>
  <div class="chip-row" id="chip-row"></div>
  <div id="results" class="scenario-list">
    <div class="loading-state">Loading the archive&hellip;</div>
  </div>
</div>

<footer class="page-footer">
  <p class="footer-text">MOSei.org &middot; <a href="https://temperedsignal.com" target="_blank">The Tempered Signal</a> &middot; &copy; Norman Applegate</p>
</footer>

<script>
var ALL_SCENARIOS = [];
var activeChip = null;

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function tokenize(text) {
  return (text.toLowerCase().match(/[a-z']+/g) || []).filter(function(w){ return w.length > 2; });
}

function sourceLabel(item) {
  return item.issue > 0 ? ('Issue #' + item.issue) : 'Framework Calibration';
}

function buildChips() {
  var counts = {};
  ALL_SCENARIOS.forEach(function(item) {
    item.tags.split(';').forEach(function(t) {
      t = t.trim();
      if (t) counts[t] = (counts[t] || 0) + 1;
    });
  });
  var top = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0, 8);
  var row = document.getElementById('chip-row');
  row.innerHTML = '';
  top.forEach(function(tag) {
    var chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = tag;
    chip.onclick = function() {
      var input = document.getElementById('search-input');
      if (activeChip === tag) {
        activeChip = null;
        input.value = '';
      } else {
        activeChip = tag;
        input.value = tag;
      }
      renderChips();
      runSearch();
    };
    row.appendChild(chip);
  });
  var clear = document.createElement('span');
  clear.className = 'chip-clear';
  clear.id = 'chip-clear';
  clear.textContent = 'Clear';
  clear.style.display = 'none';
  clear.onclick = function() {
    activeChip = null;
    document.getElementById('search-input').value = '';
    renderChips();
    runSearch();
  };
  row.appendChild(clear);
  renderChips();
}

function renderChips() {
  var row = document.getElementById('chip-row');
  Array.prototype.forEach.call(row.querySelectorAll('.chip'), function(el) {
    el.classList.toggle('active', el.textContent === activeChip);
  });
  var clear = document.getElementById('chip-clear');
  if (clear) clear.style.display = activeChip ? 'inline-block' : 'none';
}

function scoreEntry(item, queryTokens) {
  if (queryTokens.length === 0) return 1;
  var haystack = (item.situation + ' ' + item.framework + ' ' + item.tags + ' ' + item.subject).toLowerCase();
  var score = 0;
  queryTokens.forEach(function(t) {
    if (haystack.indexOf(t) !== -1) score++;
  });
  return score;
}

function runSearch() {
  var q = document.getElementById('search-input').value.trim();
  var qTokens = tokenize(q);
  var scored = ALL_SCENARIOS.map(function(item) {
    return { item: item, score: scoreEntry(item, qTokens) };
  });
  var matched = q === '' ? scored : scored.filter(function(s) { return s.score > 0; });
  matched.sort(function(a, b) {
    if (b.score !== a.score) return b.score - a.score;
    return b.item.issue - a.item.issue;
  });
  renderResults(matched.map(function(s) { return s.item; }), q);
}

function renderResults(items, query) {
  var container = document.getElementById('results');
  var countEl = document.getElementById('result-count');
  if (query === '') {
    countEl.textContent = items.length + ' situations in the archive';
  } else {
    countEl.textContent = items.length + (items.length === 1 ? ' match' : ' matches') + ' for "' + query + '"';
  }
  if (items.length === 0) {
    container.innerHTML = '<div class="empty-state">' +
      '<p>Nothing in the archive matches that yet -- it will grow every month. In the meantime, ask MOSei directly and it will reason from the full framework.</p>' +
      '<a href="knowledge.html#ask-mosei">Ask MOSei &rarr;</a>' +
      '</div>';
    return;
  }
  container.innerHTML = items.map(function(item, idx) {
    var id = 'scenario-' + idx;
    var label = sourceLabel(item);
    var citeSubject = item.issue > 0 ? (' &mdash; ' + esc(item.subject)) : '';
    return '<div class="scenario-card" id="' + id + '">' +
      '<div class="scenario-head" onclick="toggleCard(\'' + id + '\')">' +
        '<div><div class="scenario-situation">&ldquo;' + esc(item.situation) + '&rdquo;</div>' +
        '<div class="scenario-meta">' + label + ' &middot; ' + esc(item.framework) + '</div></div>' +
        '<div class="scenario-caret">&#9656;</div>' +
      '</div>' +
      '<div class="scenario-body"><div class="scenario-body-inner">' +
        '<div class="scenario-block"><div class="scenario-label">Framework Concept</div><div class="scenario-value framework">' + esc(item.framework) + '</div></div>' +
        '<div class="scenario-block"><div class="scenario-label">If You Do One Thing</div><div class="scenario-value">' + esc(item.action) + '</div></div>' +
        '<div class="scenario-cite"><b>Source:</b> ' + label + citeSubject + '<br>' + esc(item.summary) + '</div>' +
      '</div></div>' +
    '</div>';
  }).join('');
}

function toggleCard(id) {
  var el = document.getElementById(id);
  var wasOpen = el.classList.contains('open');
  Array.prototype.forEach.call(document.querySelectorAll('.scenario-card.open'), function(c) {
    c.classList.remove('open');
  });
  if (!wasOpen) el.classList.add('open');
}

document.getElementById('search-input').addEventListener('input', function() {
  activeChip = null;
  renderChips();
  runSearch();
});

fetch('situations.json')
  .then(function(res) { return res.json(); })
  .then(function(data) {
    ALL_SCENARIOS = data;
    document.getElementById('hero-sub').textContent = data.length + ' tagged situations and counting. Search in your own words, or browse by concept below.';
    buildChips();
    runSearch();
  })
  .catch(function() {
    document.getElementById('results').innerHTML = '<div class="empty-state"><p>Could not load the archive right now. Try refreshing, or ask MOSei directly.</p><a href="knowledge.html#ask-mosei">Ask MOSei &rarr;</a></div>';
  });
</script>

</body>
</html>
